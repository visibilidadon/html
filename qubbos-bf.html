<body>
  <div id="__bundler_placeholder">Loading Black Friday frigoríficos · qubbos...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ertas de frigoríficos para Black Friday<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #333333\">Black Friday es el mejor momento del año para renovar el frigorífico. Hemos seleccionado los modelos combi, americanos, integrables y de una o dos puertas con mejor relación calidad-precio y les hemos aplicado descuento durante la campaña.<\u002Fp>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #333333\">Compara capacidad, sistema No Frost y clase energética y, si tienes dudas, escríbenos: te asesoramos antes y después de la compra. Además, retiramos tu frigorífico antiguo y te lo instalamos.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 320px; background: #F7F1F4; border-radius: 10px; padding: 24px 26px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #480E30\">Compra por tipo<\u002Fspan>\n<a href=\"https://qubbos.es/collections/frigorificos\" style=\"display: flex; justify-content: space-between; text-decoration: none; color: #111111; font-weight: 600; font-size: 16px; padding: 6px 0; border-bottom: 1px solid #E8DCE2\">Frigoríficos combi <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n<a href=\"https://qubbos.es/collections/frigorificos-americanos\" style=\"display: flex; justify-content: space-between; text-decoration: none; color: #111111; font-weight: 600; font-size: 16px; padding: 6px 0; border-bottom: 1px solid #E8DCE2\">Frigoríficos americanos <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n<a href=\"https://qubbos.es/collections/frigorificos-de-una-puerta\" style=\"display: flex; justify-content: space-between; text-decoration: none; color: #111111; font-weight: 600; font-size: 16px; padding: 6px 0; border-bottom: 1px solid #E8DCE2\">Frigoríficos de una puerta <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n<a href=\"https://qubbos.es/collections/frigorificos-de-dos-puertas\" style=\"display: flex; justify-content: space-between; text-decoration: none; color: #111111; font-weight: 600; font-size: 16px; padding: 6px 0\">Frigoríficos de dos puertas <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Ofertas -->\n<section id=\"ofertas\" style=\"padding: 40px 0 16px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 22px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<sc-for list=\"{{filters}}\" as=\"f\" hint-placeholder-count=\"5\">\n<button sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"font-size: 15px; color: #555555\">{{count}} productos en oferta<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px 24px\">\n<sc-for list=\"{{shown}}\" as=\"p\" hint-placeholder-count=\"8\">\n<a href=\"{{ p.url }}\" style=\"text-decoration: none; color: #111111; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"position: relative; background: #F5F5F5; border-radius: 10px; height: 300px; display: flex; align-items: center; justify-content: center\">\n<span style=\"position: absolute; top: 14px; left: 14px; background: #A40A28; color: #FFFFFF; font-size: 14px; font-weight: 700; padding: 5px 12px; border-radius: 24px\">-{{ p.pct }}%<\u002Fspan>\n<span style=\"position: absolute; top: 14px; right: 14px; background: #480E30; color: #FFFFFF; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 24px\">Black Friday<\u002Fspan>\n<sc-if value=\"{{ p.isCombi }}\" hint-placeholder-val=\"{{ true }}\">\n<svg width=\"92\" height=\"236\" sc-camel-view-box=\"0 0 80 250\" aria-hidden=\"true\"><rect x=\"5\" y=\"5\" width=\"70\" height=\"236\" rx=\"6\" fill=\"{{ p.fill }}\" stroke=\"{{ p.line }}\" stroke-width=\"2\"><\u002Frect><line x1=\"5\" y1=\"160\" x2=\"75\" y2=\"160\" stroke=\"{{ p.line }}\" stroke-width=\"2\"><\u002Fline><rect x=\"64\" y=\"40\" width=\"3\" height=\"40\" rx=\"1.5\" fill=\"{{ p.line }}\"><\u002Frect><rect x=\"64\" y=\"172\" width=\"3\" height=\"28\" rx=\"1.5\" fill=\"{{ p.line }}\"><\u002Frect><\u002Fsvg>\n<\u002Fsc-if>\n<sc-if value=\"{{ p.isAmericano }}\" hint-placeholder-val=\"{{ false }}\">\n<svg width=\"170\" height=\"240\" sc-camel-view-box=\"0 0 120 170\" aria-hidden=\"true\"><rect x=\"5\" y=\"5\" width=\"110\" height=\"160\" rx=\"6\" fill=\"{{ p.fill }}\" stroke=\"{{ p.line }}\" stroke-width=\"2\"><\u002Frect><line x1=\"60\" y1=\"5\" x2=\"60\" y2=\"165\" stroke=\"{{ p.line }}\" stroke-width=\"2\"><\u002Fline><rect x=\"52\" y=\"45\" width=\"3\" height=\"40\" rx=\"1.5\" fill=\"#BDBDBD\"><\u002Frect><rect x=\"65\" y=\"45\" width=\"3\" height=\"40\" rx=\"1.5\" fill=\"#BDBDBD\"><\u002Frect><rect x=\"16\" y=\"32\" width=\"20\" height=\"26\" rx=\"3\" fill=\"{{ p.line }}\"><\u002Frect><\u002Fsvg>\n<\u002Fsc-if>\n<sc-if value=\"{{ p.isUna }}\" hint-placeholder-val=\"{{ false }}\">\n<svg width=\"92\" height=\"236\" sc-camel-view-box=\"0 0 80 250\" aria-hidden=\"true\"><rect x=\"5\" y=\"5\" width=\"70\" height=\"236\" rx=\"6\" fill=\"{{ p.fill }}\" stroke=\"{{ p.line }}\" stroke-width=\"2\"><\u002Frect><rect x=\"64\" y=\"60\" width=\"3\" height=\"70\" rx=\"1.5\" fill=\"{{ p.line }}\"><\u002Frect><\u002Fsvg>\n<\u002Fsc-if>\n<sc-if value=\"{{ p.isDos }}\" hint-placeholder-val=\"{{ false }}\">\n<svg width=\"92\" height=\"220\" sc-camel-view-box=\"0 0 80 230\" aria-hidden=\"true\"><rect x=\"5\" y=\"5\" width=\"70\" height=\"220\" rx=\"6\" fill=\"{{ p.fill }}\" stroke=\"{{ p.line }}\" stroke-width=\"2\"><\u002Frect><line x1=\"5\" y1=\"62\" x2=\"75\" y2=\"62\" stroke=\"{{ p.line }}\" stroke-width=\"2\"><\u002Fline><rect x=\"64\" y=\"22\" width=\"3\" height=\"26\" rx=\"1.5\" fill=\"{{ p.line }}\"><\u002Frect><rect x=\"64\" y=\"78\" width=\"3\" height=\"40\" rx=\"1.5\" fill=\"{{ p.line }}\"><\u002Frect><\u002Fsvg>\n<\u002Fsc-if>\n<sc-if value=\"{{ p.isRetro }}\" hint-placeholder-val=\"{{ false }}\">\n<svg width=\"96\" height=\"170\" sc-camel-view-box=\"0 0 80 140\" aria-hidden=\"true\"><rect x=\"5\" y=\"5\" width=\"70\" height=\"128\" rx=\"14\" fill=\"{{ p.fill }}\" stroke=\"{{ p.line }}\" stroke-width=\"2\"><\u002Frect><rect x=\"62\" y=\"34\" width=\"4\" height=\"30\" rx=\"2\" fill=\"#C9C9C9\"><\u002Frect><\u002Fsvg>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n<span style=\"font-size: 15px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: #111111\">{{ p.brand }}<\u002Fspan>\n<sc-if value=\"{{ p.hasEnergy }}\" hint-placeholder-val=\"{{ true }}\">\n<span style=\"{{ p.energyStyle }}\">{{ p.energy }}<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n<span style=\"font-size: 16px; line-height: 1.45\">{{ p.title }}<\u002Fspan>\n<span style=\"font-size: 14px; color: #555555\">{{ p.tipo }}<\u002Fspan>\n<div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px\">\n<span style=\"font-size: 24px; font-weight: 700; color: #A40A28\">{{ p.bf }}<\u002Fspan>\n<span style=\"font-size: 15px; color: #555555; text-decoration: line-through\">{{ p.old }}<\u002Fspan>\n<\u002Fdiv>\n<span style=\"font-size: 14px; font-weight: 600; color: #480E30\">Ahorras {{ p.save }}<\u002Fspan>\n<span style=\"margin-top: 4px; align-self: flex-start; background: #480E30; color: #FFFFFF; font-weight: 600; font-size: 15px; height: 46px; padding: 0 26px; border-radius: 100px; display: inline-flex; align-items: center\">Ver oferta<\u002Fspan>\n<\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Banner cruzado lavadoras -->\n<section style=\"margin: 48px 0 0; background: #F7F1F4; border-radius: 10px; padding: 36px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px; flex: 1 1 420px\">\n<h2 style=\"margin: 0; font-size: 26px; font-weight: 700\">¿También renuevas la lavadora?<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; color: #333333; line-height: 1.6\">Aprovecha el mismo envío y la retirada del antiguo con nuestras lavadoras en oferta de Black Friday.<\u002Fp>\n<\u002Fdiv>\n<a href=\"https://qubbos.es/collections/lavadoras\" style=\"background: #480E30; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px; height: 48px; padding: 0 28px; border-radius: 100px; display: inline-flex; align-items: center\">Ver lavadoras<\u002Fa>\n<\u002Fsection>\n\n<!-- Guía y FAQ (texto SEO bajo el listado) -->\n<section id=\"guia\" style=\"padding: 64px 0 24px; display: flex; flex-wrap: wrap; gap: 48px\">\n<div style=\"flex: 1 1 560px; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-size: 30px; font-weight: 700; line-height: 1.2\">Cómo elegir frigorífico en Black Friday<\u002Fh2>\n<h3 style=\"margin: 8px 0 0; font-size: 20px; font-weight: 700\">Combi, americano o de una puerta<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #333333\">El combi es la opción más equilibrada para la mayoría de cocinas: congelador abajo y unos 60 cm de ancho. El americano gana capacidad y espacio para familias grandes, pero necesita unos 90 cm de hueco. Los de una puerta y los integrables encajan en cocinas con el frigorífico oculto tras un panel.<\u002Fp>\n<h3 style=\"margin: 8px 0 0; font-size: 20px; font-weight: 700\">No Frost y clase energética<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #333333\">Con No Frost te olvidas de descongelar. Fíjate también en la etiqueta energética: un frigorífico funciona las 24 horas, así que una clase más eficiente se nota en la factura año tras año.<\u002Fp>\n<h3 style=\"margin: 8px 0 0; font-size: 20px; font-weight: 700\">Mide antes de comprar<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #333333\">Comprueba alto, ancho y fondo del hueco y deja unos centímetros para la ventilación y la apertura de puertas. Si dudas, nuestro equipo te ayuda a elegir.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 4px\">\n<h2 style=\"margin: 0 0 12px; font-size: 30px; font-weight: 700\">Preguntas frecuentes<\u002Fh2>\n<details open=\"\" style=\"border-bottom: 1px solid #ECECEC; padding: 16px 0\">\n<summary style=\"font-size: 17px; font-weight: 600; cursor: pointer\">¿Cuándo es el Black Friday 2026?<\u002Fsummary>\n<p style=\"margin: 10px 0 0; font-size: 16px; line-height: 1.6; color: #333333\">El Black Friday 2026 es el viernes 27 de noviembre. Las ofertas de esta página están activas durante la campaña o hasta agotar existencias.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #ECECEC; padding: 16px 0\">\n<summary style=\"font-size: 17px; font-weight: 600; cursor: pointer\">¿Retiráis mi frigorífico antiguo?<\u002Fsummary>\n<p style=\"margin: 10px 0 0; font-size: 16px; line-height: 1.6; color: #333333\">Sí. Al hacer el pedido puedes añadir la retirada del antiguo y la instalación del nuevo.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #ECECEC; padding: 16px 0\">\n<summary style=\"font-size: 17px; font-weight: 600; cursor: pointer\">¿Puedo financiar la compra?<\u002Fsummary>\n<p style=\"margin: 10px 0 0; font-size: 16px; line-height: 1.6; color: #333333\">Sí, puedes pagar a plazos con nuestras opciones de financiación durante el proceso de compra.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #ECECEC; padding: 16px 0\">\n<summary style=\"font-size: 17px; font-weight: 600; cursor: pointer\">¿Qué frigorífico es mejor para una familia?<\u002Fsummary>\n<p style=\"margin: 10px 0 0; font-size: 16px; line-height: 1.6; color: #333333\">Para 3 o 4 personas un combi de 330 a 390 litros suele ser suficiente. Si sois más o compráis para toda la semana, un americano de más de 480 litros te dará margen.<\u002Fp>\n<\u002Fdetails>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<!-- Pie -->\n<footer style=\"background: #480F30; color: #FFFFFF; margin-top: 56px\">\n<div style=\"max-width: 1360px; margin: 0 auto; padding: 48px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 360px\">\n<span style=\"font-size: 28px; font-weight: 700; letter-spacing: -0.02em\">qubbos<\u002Fspan>\n<span style=\"font-size: 16px; color: #F3E6EE\">Primeras marcas. Mejores precios.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 48px; font-size: 15px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\"><strong>Frigoríficos<\u002Fstrong><a href=\"https://qubbos.es/collections/frigorificos-americanos\" style=\"color: #FFFFFF; text-decoration: none\">Americanos<\u002Fa><a href=\"https://qubbos.es/collections/frigorificos-de-una-puerta\" style=\"color: #FFFFFF; text-decoration: none\">Una puerta<\u002Fa><a href=\"https://qubbos.es/collections/frigorificos-de-dos-puertas\" style=\"color: #FFFFFF; text-decoration: none\">Dos puertas<\u002Fa><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\"><strong>Ayuda<\u002Fstrong><span>Envío y entrega<\u002Fspan><span>Retirada del antiguo<\u002Fspan><span>Financiación<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;descuento&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:5,&quot;max&quot;:40,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;default&quot;:15},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:4300}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { f: 'todos' };\n  }\n  renderVals() {\n    const d = this.props.descuento ?? 15;\n    const fmt = new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n    const eur = (n) => fmt.format(n) + ' €';\n    const finishes = {\n      inox: ['#D9DADC', '#8E8E8E'],\n      blanco: ['#FFFFFF', '#B5B5B5'],\n      negro: ['#2A2A2E', '#0E0E10'],\n      beige: ['#EADBC3', '#B9A88C'],\n      panel: ['#EFE7DC', '#B8AB98']\n    };\n    const energyColors = {\n      A: 'background: #00813E; color: #FFFFFF',\n      D: 'background: #FFD500; color: #111111',\n      E: 'background: #F7A600; color: #111111'\n    };\n    const raw = [\n      { brand: 'Samsung', title: 'Frigorífico combi Samsung RB38C607AS9/EF de 387 l, clase A', price: 782, shape: 'combi', fam: 'combi', tipo: 'Combi · No Frost', finish: 'inox', energy: 'A', handle: 'frigorifico-combi-samsung-rb38c607as9-ef' },\n      { brand: 'LG', title: 'Frigorífico combi LG GBV7280AMB, 387 l, clase A', price: 898, shape: 'combi', fam: 'combi', tipo: 'Combi', finish: 'inox', energy: 'A', handle: 'frigorifico-combi-lg-gbv7280amb-inox' },\n      { brand: 'Hisense', title: 'Frigorífico combi Hisense RB440N4ACA, 336 l, Total No Frost', price: 766, shape: 'combi', fam: 'combi', tipo: 'Combi · Total No Frost', finish: 'inox', energy: '', handle: 'frigorifico-combi-hisense-rb440n4aca-inox' },\n      { brand: 'Samsung', title: 'Frigorífico combi Samsung RB34C775CS9/EF de 344 l con No Frost y Wi-Fi', price: 587, shape: 'combi', fam: 'combi', tipo: 'Combi · No Frost · Wi-Fi', finish: 'inox', energy: '', handle: 'frigorifico-combi-samsung-rb34c775cs9-ef' },\n      { brand: 'Hisense', title: 'Frigorífico americano Hisense RQ768N4GBE, 591 l, Total No Frost', price: 1521, shape: 'americano', fam: 'americano', tipo: 'Americano · Cristal negro', finish: 'negro', energy: '', handle: 'frigorifico-americano-hisense-rq768n4gbe-cristal-negro' },\n      { brand: 'Samsung', title: 'Frigorífico americano Samsung RF48A401EM9/EF de 488 l, No Frost', price: 782, shape: 'americano', fam: 'americano', tipo: 'Americano · No Frost', finish: 'inox', energy: '', handle: 'frigorifico-americano-samsung-rf48a401em9ef-inox' },\n      { brand: 'Bosch', title: 'Frigorífico integrable Bosch KIR81ADD0 de 310 l, clase D', price: 714, shape: 'una', fam: 'una', tipo: 'Una puerta · Integrable', finish: 'panel', energy: 'D', handle: 'frigorifico-1-puerta-integrable-bosch-kir81add0' },\n      { brand: 'Balay', title: 'Frigorífico combi integrable Balay 3KIE712F, 260 l y congelador NoFrost', price: 630, shape: 'combi', fam: 'combi', tipo: 'Combi · Integrable', finish: 'panel', energy: '', handle: 'frigorifico-combi-integrable-balay-3kie712f' },\n      { brand: 'Teka', title: 'Frigorífico de dos puertas Teka RTF 3210, 235 l y clase E', price: 250, shape: 'dos', fam: 'dos', tipo: 'Dos puertas', finish: 'blanco', energy: 'E', handle: 'frigorifico-2-puertas-teka-rtf3210-blanco' },\n      { brand: 'Fagor', title: 'Frigorífico de una puerta Fagor 3FFV-855BG retro beige, 108 l', price: 269, shape: 'retro', fam: 'una', tipo: 'Una puerta · Retro', finish: 'beige', energy: '', handle: 'frigorifico-1-puerta-fagor-3ffv855bg-crema' },\n      { brand: 'Hisense', title: 'Frigorífico combi Hisense RB372N4AWE, 292 l, Total No Frost', price: 383, shape: 'combi', fam: 'combi', tipo: 'Combi · Total No Frost', finish: 'blanco', energy: '', handle: 'frigorifico-combi-hisense-rb372n4awe-blanco' },\n      { brand: 'Fagor', title: 'Frigorífico de dos puertas Fagor 3FFV-1455BG, 206 l, beige', price: 443, shape: 'dos', fam: 'dos', tipo: 'Dos puertas · Retro', finish: 'beige', energy: '', handle: 'frigorifico-2-puertas-fagor-3ffv-1455bg-beige' }\n    ];\n    const items = raw.map((r) => {\n      const bf = Math.round(r.price * (1 - d / 100));\n      const fin = finishes[r.finish];\n      return {\n        brand: r.brand, title: r.title, tipo: r.tipo, fam: r.fam,\n        url: 'https://qubbos.es/products/' + r.handle,\n        pct: d, bf: eur(bf), old: eur(r.price), save: eur(r.price - bf),\n        fill: fin[0], line: fin[1],\n        isCombi: r.shape === 'combi', isAmericano: r.shape === 'americano', isUna: r.shape === 'una', isDos: r.shape === 'dos', isRetro: r.shape === 'retro',\n        hasEnergy: !!r.energy, energy: r.energy,\n        energyStyle: (energyColors[r.energy] || '') + '; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 4px'\n      };\n    });\n    const cur = this.state.f;\n    const defs = [['todos', 'Todos'], ['combi', 'Combi'], ['americano', 'Americanos'], ['una', 'Una puerta'], ['dos', 'Dos puertas']];\n    const filters = defs.map(([id, label]) => ({\n      label,\n      pick: () => this.setState({ f: id }),\n      style: 'height: 44px; padding: 0 20px; border-radius: 100px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; ' + (cur === id ? 'background: #480E30; color: #FFFFFF; border: 1px solid #480E30' : 'background: #FFFFFF; color: #111111; border: 1px solid #CFCFCF')\n    }));\n    const shown = cur === 'todos' ? items : items.filter((i) => i.fam === cur);\n    return { descuento: d, filters, shown, count: shown.length };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
